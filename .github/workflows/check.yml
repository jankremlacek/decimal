name: Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The two latest Go releases, the supported set.
        go: [ "1.26.x", "1.27.x" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

    - name: Vet
      run: make vet

    - name: Build
      run: go build ./...

    - name: Test
      run: make test

    - name: Fuzz
      run: make test-fuzz FUZZTIME=30s

    - name: Check go.mod is tidy and the tree is clean
      run: |
        go mod tidy
        git diff --exit-code
        test -z "$(git status --porcelain)"
